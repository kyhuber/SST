# HPIC single source of truth — Worker config.
#
# This is a standalone Worker, deliberately separate from the membership lookup
# tool. It shares no secrets with it: the membership tool's APPS_SCRIPT_URL,
# VOLUNTEER_TOKEN, and LGL_API_KEY have no role here. (An LGL key arrives in
# Phase 2, and it should be a freshly issued one scoped to this tool.)
#
# Secrets are NOT set here. Use `wrangler secret put`:
#   wrangler secret put QBO_CLIENT_ID
#   wrangler secret put QBO_CLIENT_SECRET
#   wrangler secret put ACCESS_PASSPHRASE

name = "hpic-sst"
main = "src/index.ts"
compatibility_date = "2025-01-01"
account_id = "44727137a1b418b1857ce737742b57f7"
workers_dev = true

# Sole custodian of the QuickBooks OAuth tokens. See src/tokens.ts for why this
# cannot be an environment variable.
[[durable_objects.bindings]]
name = "TOKEN_STORE"
class_name = "TokenStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenStore"]

[vars]
# "sandbox" or "production" — selects the QuickBooks API base URL.
QBO_ENV = "sandbox"

# "fixture" serves recorded data and never calls Intuit. Switch to "live" once
# the developer app, sandbox company, and OAuth seeding are in place.
QBO_MODE = "live"

# NOTE: QBO_REALM_ID, QBO_OPERATING_ACCOUNT_ID, and QBO_REBUILD_FUND_ACCOUNT_ID
# are deliberately NOT here. This repository is public, and those values name
# HPIC's actual QuickBooks company and accounts. They are set as secrets:
#
#   printf '%s' "<value>" | npx wrangler secret put QBO_REALM_ID
#
# A name cannot be both a [vars] entry and a secret — Cloudflare rejects the
# binding collision — so a var must be removed and deployed before the secret
# of the same name can be created.

# Must match the redirect URI registered on the Intuit app EXACTLY — scheme,
# casing, and trailing slash included.
QBO_REDIRECT_URI = "https://hpic-sst.kyhuber-ft.workers.dev/oauth/callback"

# Account mapping is a secret too (see the note above). Find the IDs with
# /admin/accounts. Sandbox values at time of writing: 35 = "Checking",
# 36 = "Savings". An unset ID renders "not configured" rather than failing.

# Origin of the GitHub Pages frontend, for CORS. Narrow this from a wildcard
# before the dashboard is shared with the board.
ALLOWED_ORIGIN = "https://kyhuber.github.io"
